name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full supported range: 8.1 is the package floor, 8.5 the ceiling.
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      # No committed lock file: dev deps resolve per PHP version.
      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/phpunit

  integration:
    name: WP ${{ matrix.wp-label }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Curated corners, not a cross product: the two floors together, the
      # two ceilings together, and the current release across the range. A
      # full product would pair PHP 8.5 with WordPress versions released
      # years before it, which no consumer runs and which only tests
      # WordPress's own deprecation noise.
      matrix:
        include:
          - { php: '8.1', wp: '6.0.*', wp-label: '6.0 (floor)' }
          - { php: '8.1', wp: '^7.0', wp-label: '7.x' }
          - { php: '8.3', wp: '6.9.*', wp-label: '6.9' }
          - { php: '8.4', wp: '^7.0', wp-label: '7.x' }
          - { php: '8.5', wp: '^7.0', wp-label: '7.x' }
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer, wp-cli
          coverage: none

      # Builds a throwaway consumer project the way the README documents,
      # installs WordPress, and asserts the off-platform, on-platform,
      # kill-switch, CLI, and HTTP contracts. See tests/integration/run.sh.
      - name: Integration harness
        env:
          WP_CORE: ${{ matrix.wp }}
          DB_HOST: 127.0.0.1
          DB_NAME: wp
          DB_USER: root
          DB_PASS: root
        run: bash tests/integration/run.sh
